org.gradle.parallel = true
org.gradle.caching = true
# MAX Engine is versioned on its own line, independently of MAX Patcher (0.1.0) and of MAX Patches.
#
# The line continues upstream's: Morphe Patcher 2.3.0 -> MAX Engine 2.3.1. That is deliberate.
# Every patch bundle declares a minimum patcher version in its manifest ("Patcher-Version"), and the
# manager refuses a bundle that needs a newer patcher than it carries. MAX Engine's public ABI is
# byte-for-byte the upstream 2.3.0 ABI (api/morphe-patcher.api is unchanged), so a bundle built for
# 2.3.0 does run on it; a patch bump is exactly what semver says to do for that. Starting at 0.1.0
# would have rejected every inherited bundle for no technical reason.
#
# MAX's own increments go on top: 2.3.2, 2.3.3, ... and 2.4.0 only when the ABI moves.
version = 2.3.1
