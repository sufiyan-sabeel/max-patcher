name: Development build

# Builds a debug APK and records its SHA-256. It publishes nothing: no release, no tag, no upload
# anywhere but the workflow's own artifacts. A real release stays blocked until a build succeeds and
# the APK installs on a device.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Files pushed through the GitHub API lose the executable bit, so the wrapper is invoked
      # through bash rather than relying on its mode.
      - name: Make the wrapper runnable
        run: chmod +x gradlew

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            25
            21

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Verify dependency pins
        run: |
          # The build must use exactly the commits recorded in vendor/PINS.md.
          test "$(git -C vendor/ARSCLib rev-parse HEAD)" = "675bed2de397097400ba6f0c808e28005ae5aa53" \
            || { echo "vendor/ARSCLib is not at its pinned commit"; exit 1; }
          # vendor/smali is vendored source at bbabf5f9 with the SPDX plugin removed; its presence
          # and the absence of the plugin are what matter, not a git object.
          test -f vendor/smali/dexlib2/build.gradle || { echo "vendor/smali is missing"; exit 1; }
          # Only an uncommented application counts: the restore instructions in that file mention
          # the plugin id, and a plain grep matched them and failed this check on its first run.
          ! grep -qE '^[[:space:]]*id\("org\.spdx\.sbom"\)' vendor/smali/dexlib2/build.gradle \
            || { echo "the portal-only SPDX plugin is applied again; see vendor/PINS.md"; exit 1; }

      - name: Unit tests
        run: bash gradlew test --stacktrace

      - name: Engine tests and ABI check
        run: bash gradlew -p engine test apiCheck --stacktrace

      - name: Assemble debug APK
        run: bash gradlew :app:assembleDebug --stacktrace

      - name: Checksums
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: max-patcher-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report
        run: |
          echo "### Development build" >> "$GITHUB_STEP_SUMMARY"
          echo "Not a release. Unsigned debug build for testing only." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat app/build/outputs/apk/debug/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
