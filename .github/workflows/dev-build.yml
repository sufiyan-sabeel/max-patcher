name: Development build

# Builds a debug APK and records its SHA-256. It publishes nothing: no release, no tag, no upload
# anywhere but the workflow's own artifacts. A real release stays blocked until a build succeeds and
# the APK installs on a device.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Files pushed through the GitHub API lose the executable bit, so the wrapper is invoked
      # through bash rather than relying on its mode.
      - name: Make the wrapper runnable
        run: chmod +x gradlew

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            25
            21

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Verify dependency pins
        run: |
          # The build must use exactly the commits recorded in vendor/PINS.md.
          test "$(git -C vendor/ARSCLib rev-parse HEAD)" = "675bed2de397097400ba6f0c808e28005ae5aa53" \
            || { echo "vendor/ARSCLib is not at its pinned commit"; exit 1; }
          # vendor/smali is vendored source at bbabf5f9 with the SPDX plugin removed; its presence
          # and the absence of the plugin are what matter, not a git object.
          test -f vendor/smali/dexlib2/build.gradle || { echo "vendor/smali is missing"; exit 1; }
          # Only an uncommented application counts: the restore instructions in that file mention
          # the plugin id, and a plain grep matched them and failed this check on its first run.
          ! grep -qE '^[[:space:]]*id\("org\.spdx\.sbom"\)' vendor/smali/dexlib2/build.gradle \
            || { echo "the portal-only SPDX plugin is applied again; see vendor/PINS.md"; exit 1; }

      - name: Unit tests
        run: bash gradlew test --stacktrace

      - name: Engine tests and ABI check
        run: bash gradlew -p engine test apiCheck --stacktrace

      - name: Assemble debug APK
        run: bash gradlew :app:assembleDebug --stacktrace

      - name: Reproducibility check
        run: |
          # Same source, same inputs, built twice: the version code is now derived from the version
          # name instead of the clock, so any difference left is packaging or signing metadata.
          set -euo pipefail
          FIRST=$(sha256sum app/build/outputs/apk/debug/*.apk | cut -d' ' -f1)
          cp app/build/outputs/apk/debug/*.apk /tmp/first.apk
          rm -rf app/build/outputs/apk
          bash gradlew :app:assembleDebug --stacktrace
          SECOND=$(sha256sum app/build/outputs/apk/debug/*.apk | cut -d' ' -f1)
          {
            echo "### Reproducibility"
            echo '```'
            echo "first build:  $FIRST"
            echo "second build: $SECOND"
            if [ "$FIRST" = "$SECOND" ]; then
              echo "result: byte-identical"
            else
              echo "result: differing bytes with identical inputs"
              echo "expected causes: APK signing block metadata, zip entry ordering"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "first  $FIRST"
          echo "second $SECOND"
          if [ "$FIRST" = "$SECOND" ]; then echo "REPRODUCIBLE=yes" >> "$GITHUB_ENV"; else
            echo "REPRODUCIBLE=no" >> "$GITHUB_ENV"; fi

      - name: Checksums
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Verify the APK signature
        run: |
          # A debug build is signed with the debug keystore; what matters here is that it is
          # signed at all and that the certificate is readable, so a release build's signing
          # problem cannot hide behind a passing debug build.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | tee apk-signature.txt
          # apksigner labels the scheme that signed: "V2 Signer:" / "V3 Signer:" when the APK uses
          # only the modern schemes, "Signer #1:" when it also carries a v1 JAR signature. Match the
          # digest line, not the label, or a v2-only APK reads as unsigned.
          grep -q "certificate SHA-256 digest" apk-signature.txt \
            || { echo "apksigner reported no signer"; exit 1; }

      - name: Dependency and licence inventory
        run: |
          # What the APK is built from and under which licences. The licensee plugin writes the
          # report at build time; it is the same list the in-app licence screen shows.
          bash gradlew :app:licensee --stacktrace
          python3 .github/scripts/licence_inventory.py
          # Fails if a component is listed with no licence text, or with an undefined licence id.
          python3 .github/scripts/licence_validate.py

      - name: SBOM
        run: |
          # From the resolved release runtime classpath, not from the APK: scanning an APK produced
          # an empty document, which is what this step replaces.
          bash gradlew :app:cyclonedxBom --stacktrace
          python3 .github/scripts/sbom_postprocess.py

      - name: Validate the SBOM against the CycloneDX schema
        run: |
          curl -sSL -o /tmp/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.27.2/cyclonedx-linux-x64
          chmod +x /tmp/cyclonedx
          /tmp/cyclonedx --version
          # Fails on a document that does not match the schema, and on one that is structurally
          # valid but empty.
          /tmp/cyclonedx validate --input-file max-patcher-sbom.cdx.json \
            --input-format json --fail-on-errors
          python3 .github/scripts/sbom_check.py
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: max-patcher-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            apk-signature.txt
            licence-inventory.txt
            max-patcher-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Report
        run: |
          echo "### Development build" >> "$GITHUB_STEP_SUMMARY"
          echo "Not a release. Unsigned debug build for testing only." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat app/build/outputs/apk/debug/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
